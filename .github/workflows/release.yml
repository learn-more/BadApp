name: release

# Tag push only. Pushing v0.9.0 builds it and leaves a *draft* release with the archives attached; nothing is
# published until the draft is released by hand from the GitHub UI.
#
# Tags gained a "v" prefix here: everything up to 0.8.0 is bare. Both still describe, see GenVersion.bat.
on:
  push:
    tags: ['v*']

# The release is created in this repository, so the default GITHUB_TOKEN needs to be able to write it. No PAT.
permissions:
  contents: write

jobs:
  release:
    # Pinned, same as msbuild.yml: x86 builds with v141_xp, which comes from a Visual Studio 2022 component that
    # is installed below at a hard-coded 2022 path. windows-latest moving to a newer image breaks that step.
    runs-on: windows-2022
    steps:
      # fetch-depth: 0 for the tags, twice over: release-notes.ps1 works out what the previous release was, and
      # GenVersion.bat runs `git describe --tags` as a pre-build event. Without the tags the version resource
      # comes out empty and the build fails in rc.exe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every configuration in BadApp.vcxproj is v141_xp against WindowsTargetPlatformVersion 5.1, so the
      # released binaries still start on XP. Neither the toolset nor that SDK is on the image by default; the
      # WinXP component brings both. Both platforms are built in this one job.
      - name: Add v141_xp tools
        working-directory: "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\"
        shell: cmd
        run: vs_installer.exe modify --quiet --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.WinXP --norestart --nocache

      - uses: microsoft/setup-msbuild@v3

      # No /p:PlatformToolset - the vcxproj pins v141_xp itself. appveyor.yml carried a PlatformToolset matrix
      # variable that its explicit build_script never passed on, so this changes nothing.
      - name: Build x86
        run: msbuild BadApp.sln /p:Configuration=Release /p:Platform=x86 /m /v:m /nologo

      - name: Build x64
        run: msbuild BadApp.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # Signing is opt-in: without the Certum settings a release still builds, unsigned and labelled as such.
      # .github/SIGNING.md lists what to store and where - only the first two are secrets, the thumbprint is a
      # repository variable because a certificate thumbprint is public information.
      #
      # In bin\ and before the archives below, because what a user runs is whatever came out of the zip. After
      # the build rather than before it: nothing here is signed before it is linked (no embedded payloads), so
      # the SimplySign session only has to last for the signing itself. Only the executables - a PDB carries no
      # signature.
      #
      # The outcome is read back off the files rather than inferred from "did the signing step run", and lands in
      # an annotation, the job summary, the banner that opens release-notes.md, and SIGNING_STATUS /
      # SIGNING_SUMMARY for the steps below. A release cannot ship claiming to be signed when it is not.
      #
      # No description:, unlike JobDebug - BadApp.exe carries a version resource, and the action prefers the
      # FileDescription in it ("Bad Application", BadApp\BadApp.rc2). That keeps the string in a single place.
      - name: Sign release binaries
        uses: learn-more/certum-signing@v1
        with:
          path: |
            bin/BadApp-x86.exe
            bin/BadApp-x64.exe
          notes-path: release-notes.md
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          username: ${{ secrets.CERTUM_USERNAME }}
          certificate-sha1: ${{ vars.CERTUM_CERTIFICATE_SHA1 }}
          timestamp-server: ${{ vars.CERTUM_TIMESTAMP_SERVER }}
          intermediate-url: ${{ vars.CERTUM_INTERMEDIATE_URL }}

      # Appends the changelog under the signing banner, so the notes are a starting point to edit rather than an
      # empty box.
      - name: Build release notes
        run: .\.github\scripts\release-notes.ps1 -Tag '${{ github.ref_name }}' -NotesPath release-notes.md

      # One archive per platform, each carrying the executable and its PDB so a crash in a released build can
      # still be symbolised. Compress-Archive is given the files directly, so it stores bare names rather than
      # a bin\ prefix.
      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path bin\BadApp-x86.exe, bin\BadApp-x86.pdb -DestinationPath dist\BadApp-x86.zip
          Compress-Archive -Path bin\BadApp-x64.exe, bin\BadApp-x64.pdb -DestinationPath dist\BadApp-x64.zip
          Get-ChildItem dist

      # The header line is a comment to `sha256sum -c`, and tells a reader whether these archives hold signed
      # binaries. SHA256SUMS.txt is excluded from its own listing because it does not exist yet when it is
      # written.
      - name: Hash release assets
        run: |
          "# BadApp ${{ github.ref_name }} - $env:SIGNING_SUMMARY" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII
          Get-ChildItem dist\* -File -Exclude SHA256SUMS.txt |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Add-Content dist\SHA256SUMS.txt -Encoding ASCII
          Get-Content dist\SHA256SUMS.txt

      # --draft so this never publishes on its own: until someone releases it by hand it is visible only to
      # collaborators, and its assets need auth to download. --verify-tag rather than letting gh create a tag of
      # its own, so a mistyped ref fails here instead of tagging something. No --generate-notes: --notes-file
      # already carries the signing banner and the changelog, which the draft is then edited over.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ghArgs = @($tag, '--draft', '--verify-tag', '--title', $tag, '--notes-file', 'release-notes.md')
          # v0.9.0-rc1 and friends: anything with a suffix after the version is not a final release.
          if ($tag -match '^v\d+\.\d+\.\d+-') { $ghArgs += '--prerelease' }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create @ghArgs @assets
